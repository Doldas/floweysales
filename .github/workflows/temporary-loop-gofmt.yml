name: Temporary Loop Gofmt
on:
  push:
    branches: [feature/85-bounded-loop-node]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format loop sources
        run: |
          gofmt -w internal/server/flows.go internal/server/flow_loop.go internal/server/flow_loop_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_loop.go internal/server/flow_loop_test.go
            git commit -m "style(go): format bounded loop implementation"
            git push
          fi
