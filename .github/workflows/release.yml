name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Test
        run: go test ./...
      - name: Build for target
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          suffix=""
          [ "$GOOS" = windows ] && suffix=".exe"
          go build -trimpath -o "dist/floweysales_backend-${GOOS}-${GOARCH}${suffix}" .
          go build -trimpath -o "dist/floweysales_mcp-${GOOS}-${GOARCH}${suffix}" ./cmd/mcp
          cd dist && sha256sum * > "SHA256SUMS-${GOOS}-${GOARCH}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 30
