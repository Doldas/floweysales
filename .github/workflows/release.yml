name: Release build and publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag, main ancestry and updater tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo 'Invalid app release tag'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Tag must point to a main commit'; exit 1; }
          bash scripts/test-auto-update.sh

  binaries:
    needs: validate
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: windows, arch: amd64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Test
        run: go test ./...
      - name: Build for target
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          suffix=""
          [ "$GOOS" = windows ] && suffix=".exe"
          ldflags="-X floweysales/internal/app.BuildCommit=${GITHUB_SHA} -X floweysales/internal/app.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "$ldflags" -o "dist/floweysales_backend-${GOOS}-${GOARCH}${suffix}" .
          go build -trimpath -o "dist/floweysales_mcp-${GOOS}-${GOARCH}${suffix}" ./cmd/mcp
          cd dist && sha256sum * > "SHA256SUMS-${GOOS}-${GOARCH}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  containers:
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned application container
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/doldas/floweysales:${{ github.ref_name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          provenance: true
      - name: Restore pinned JDBC cache for migration image
        uses: actions/cache@v4
        with:
          path: docker/vendor/mysql-connector-j-9.5.0.jar
          key: jdbc-linux-9.5.0-${{ hashFiles('docker/mysql-connector-j-9.5.0.sha256') }}
      - name: Verify or fetch MySQL Connector/J
        run: bash scripts/fetch-liquibase-jdbc.sh
      - name: Publish matching Liquibase migration container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/liquibase.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/doldas/floweysales-migrate:${{ github.ref_name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          provenance: true
      - name: Verify multi-platform manifests
        run: |
          docker buildx imagetools inspect "ghcr.io/doldas/floweysales:$GITHUB_REF_NAME"
          docker buildx imagetools inspect "ghcr.io/doldas/floweysales-migrate:$GITHUB_REF_NAME"

  github-release:
    needs: [binaries, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate and verify combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum floweysales_* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish durable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "$GITHUB_REF_NAME" == *-rc.* ]] && args+=(--prerelease)
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo 'The mutable stable container tag is deliberately NOT advanced by this workflow.'
