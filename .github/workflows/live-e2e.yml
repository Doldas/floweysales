name: Live Playwright E2E (deployed FloweySales)

# Explicitly opted in. Never run production-account browser tests from PRs,
# forks, dependency updates or automatic deployment jobs.
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: 'Optional: fail unless the deployed build is this commit (full or short SHA)'
        required: false
        type: string
        default: ''
      run_ai_probe:
        description: 'Send a real TWO-TURN Research Agent conversation (may incur model cost)'
        required: true
        type: boolean
        default: false
      run_workflows:
        description: 'Auto-discover and execute up to TWO safe [E2E] flows (may incur model cost)'
        required: true
        type: boolean
        default: false
      max_workflows:
        description: 'Upper bound of [E2E] fixtures executed when run_workflows is on (1-6)'
        required: false
        type: string
        default: '2'
      analyze_failures:
        description: 'Optional paid AI triage of sanitized failure counts (no raw user data)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: floweysales-live-e2e
  cancel-in-progress: false

jobs:
  live-playwright:
    name: Real deployed app — desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: live-e2e
      url: https://floweysales.gamitronservers.com/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen frontend test dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: List live tests without accessing the remote server
        working-directory: frontend
        run: npx playwright test --config playwright.live.config.ts --list
      - name: Run real-server Playwright browser tests
        working-directory: frontend
        env:
          CI: 'true'
          LIVE_E2E_EMAIL: ${{ secrets.LIVE_E2E_EMAIL }}
          LIVE_E2E_PASSWORD: ${{ secrets.LIVE_E2E_PASSWORD }}
          LIVE_E2E_EXPECT_COMMIT: ${{ inputs.expect_commit }}
          LIVE_E2E_AI: ${{ inputs.run_ai_probe }}
          LIVE_E2E_WORKFLOWS: ${{ inputs.run_workflows }}
          LIVE_E2E_MAX_WORKFLOWS: ${{ inputs.max_workflows }}
        run: |
          set -euo pipefail
          test -n "$LIVE_E2E_EMAIL" || { echo "::error::Configure live-e2e environment secret LIVE_E2E_EMAIL"; exit 1; }
          test -n "$LIVE_E2E_PASSWORD" || { echo "::error::Configure live-e2e environment secret LIVE_E2E_PASSWORD"; exit 1; }
          npx playwright test --config playwright.live.config.ts
      - name: Optional AI analysis of sanitized flow failures
        if: ${{ always() && inputs.analyze_failures }}
        continue-on-error: true
        env:
          LIVE_FLOW_AI_KEY: ${{ secrets.LIVE_FLOW_AI_KEY }}
          LIVE_FLOW_AI_MODEL: ${{ vars.LIVE_FLOW_AI_MODEL }}
        run: |
          set -euo pipefail
          test -f frontend/live-report/flow-failure-summary.json || { echo "No safe flow failure summary to analyze"; exit 0; }
          node scripts/analyze-flow-failures.mjs
      - name: Upload test report and failure screenshots/video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-playwright-report-${{ github.run_id }}
          path: |
            frontend/live-report/
            frontend/live-test-results/
          if-no-files-found: ignore
          retention-days: 2
