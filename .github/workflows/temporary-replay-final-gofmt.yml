name: Temporary Replay Final Gofmt
on:
  push:
    branches: [feature/79-safe-flow-replay-debug]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/server/flows.go internal/server/flow_replay_preview.go internal/server/flow_replay_preview_test.go internal/storage/flow_run_snapshots.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_replay_preview.go internal/server/flow_replay_preview_test.go internal/storage/flow_run_snapshots.go
            git commit -m "style(go): format replay and snapshot code"
            git push
          fi
