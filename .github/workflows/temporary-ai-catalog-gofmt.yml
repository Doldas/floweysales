name: Temporary Catalog Gofmt
on:
  push:
    branches: [feature/86-admin-model-catalog]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/server/ai.go internal/storage/ai_model_catalog.go internal/storage/ai_model_catalog_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/ai.go internal/storage/ai_model_catalog.go internal/storage/ai_model_catalog_test.go
            git commit -m "style(go): format AI model catalog"
            git push
          fi
