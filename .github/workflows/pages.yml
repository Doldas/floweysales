name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/sync-brand.mjs'
      - 'frontend/public/icons/**'
      - 'frontend/src/styles/_tokens.scss'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: pages-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check brand copies match the app
        run: node scripts/sync-brand.mjs --check
      - name: Build the site and check links
        run: |
          node scripts/build-docs.mjs --check
          node scripts/build-docs.mjs --out _site
          test -s _site/index.html
          test -s _site/guide/index.html
          grep -q 'FloweySales' _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    name: pages-deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
