name: Temporary Replay Gofmt
on:
  push:
    branches: [feature/79-safe-flow-replay-debug]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format replay backend
        run: |
          gofmt -w internal/server/flows.go internal/server/flow_replay_preview.go internal/server/flow_replay_preview_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_replay_preview.go internal/server/flow_replay_preview_test.go
            git commit -m "style(go): format replay implementation"
            git push
          fi
