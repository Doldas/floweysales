name: Temporary gofmt finance flow
on:
  push:
    branches: [feature/59-flow-agent-output-finance-tools]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed Go sources
        run: |
          gofmt -w internal/server/flows.go internal/server/mcp_tracker_routes.go internal/server/server.go internal/mcp/mcp.go internal/mcp/trackers.go internal/mcp/trackers_test.go cmd/mcp/main.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/mcp_tracker_routes.go internal/server/server.go internal/mcp/mcp.go internal/mcp/trackers.go internal/mcp/trackers_test.go cmd/mcp/main.go
            git commit -m "style(go): gofmt finance flow tools"
            git push
          fi
