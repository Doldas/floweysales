name: Temporary Web Crawler Format
on:
  push:
    branches: [feature/87-safe-web-crawler-node]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/server/flows.go internal/server/flow_http_get.go internal/server/flow_crawl.go internal/server/flow_crawl_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_http_get.go internal/server/flow_crawl.go internal/server/flow_crawl_test.go
            git commit -m "style(go): format web crawler"
            git push
          fi
