name: Temporary Userspace gofmt
on:
  push:
    branches: [feature/59-userspace-files-foundation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format userspace Go files
        run: |
          gofmt -w internal/server/flows.go internal/storage/userspace.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/storage/userspace.go
            git commit -m "style(go): format userspace file formats"
            git push
          fi
