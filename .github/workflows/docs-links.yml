name: Documentation external links

# Fetches every outside address the user guide links to. Outside sites can be
# down for reasons unrelated to a change, so this never gates a merge.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-docs.mjs --check --external
