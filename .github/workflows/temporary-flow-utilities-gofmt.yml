name: Temporary Flow Utilities gofmt
on:
  push:
    branches:
      - feature/59-flow-result-utilities-log-views
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format and commit Go utility sources
        run: |
          gofmt -w internal/server/flows.go internal/server/flow_utilities_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_utilities_test.go
            git commit -m "style(go): gofmt result utility nodes"
            git push
          fi
