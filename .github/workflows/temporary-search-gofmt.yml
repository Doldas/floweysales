name: Temporary Web Search Gofmt
on:
  push:
    branches: [feature/90-flow-web-search]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/server/flows.go internal/server/flow_web_search.go internal/server/flow_web_search_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_web_search.go internal/server/flow_web_search_test.go
            git commit -m "style(go): format web search node"
            git push
          fi
