name: Temporary Flow Mapping Format
on:
  push:
    branches: [feature/78-flow-field-mapping]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/server/flows.go internal/server/flow_engine_v2.go internal/server/flow_field_mapping_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_engine_v2.go internal/server/flow_field_mapping_test.go
            git commit -m "style(go): format flow field mapping"
            git push
          fi
