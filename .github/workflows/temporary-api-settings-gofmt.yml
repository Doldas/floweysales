name: Temporary Admin Settings Go Format
on:
  push:
    branches: [feature/88-admin-api-settings]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed Go files
        run: |
          gofmt -w internal/server/server.go internal/server/api_integration_settings.go internal/server/api_integration_settings_test.go internal/storage/api_integration_secrets.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/server.go internal/server/api_integration_settings.go internal/server/api_integration_settings_test.go internal/storage/api_integration_secrets.go
            git commit -m "style(go): format encrypted integration settings"
            git push
          fi
