name: Promote tested release to stable containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable GitHub Release tag, e.g. v1.2.3'
        required: true
        type: string
      confirmation:
        description: 'Type PROMOTE after checking the release, migration and rollback plan'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - name: Verify operator intent, released tag and candidate status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == PROMOTE ]] || { echo 'Explicit PROMOTE confirmation required'; exit 1; }
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Only stable SemVer releases can be promoted'; exit 1; }
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both immutable versioned image manifests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/doldas/floweysales:$VERSION"
          docker buildx imagetools inspect "ghcr.io/doldas/floweysales-migrate:$VERSION"
      - name: Promote migration first, application last
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ghcr.io/doldas/floweysales-migrate:stable \
            "ghcr.io/doldas/floweysales-migrate:$VERSION"
          docker buildx imagetools create \
            -t ghcr.io/doldas/floweysales:stable \
            "ghcr.io/doldas/floweysales:$VERSION"
          docker buildx imagetools inspect ghcr.io/doldas/floweysales:stable
          docker buildx imagetools inspect ghcr.io/doldas/floweysales-migrate:stable
