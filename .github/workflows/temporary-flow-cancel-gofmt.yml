name: Temporary flow cancellation gofmt
on:
  push:
    branches: [feature/75-flow-run-cancellation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Go files
        run: |
          gofmt -w internal/server/server.go internal/server/flows.go internal/server/flow_cancellation_test.go internal/storage/agent_flows.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/server.go internal/server/flows.go internal/server/flow_cancellation_test.go internal/storage/agent_flows.go
            git commit -m "style(go): format flow cancellation changes"
            git push
          fi
