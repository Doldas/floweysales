name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test policy guardrails
        run: bash scripts/test-pr-policy.sh
      - name: Test repository gate audit
        run: node --test scripts/audit-repository-gates.test.mjs
      - name: Test documentation build and brand sync
        run: node --test scripts/build-docs.test.mjs
      - name: Check brand copies, build the user guide and check its links
        run: |
          node scripts/sync-brand.mjs --check
          node scripts/build-docs.mjs --check
      - name: Check branch naming and linked issue
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/check-pr-policy.sh

  go:
    name: go
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-preview
          path: www/browser
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            while IFS= read -r file; do
              echo "===GOFMT_START:$file"
              gofmt "$file" | base64 -w0
              echo
              echo "===GOFMT_END:$file"
            done <<< "$unformatted"
            exit 1
          fi
      - name: Resolve Go module checksums
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::Commit the updated Go module metadata."
            echo "===GO_MOD_SUM_START"
            base64 -w0 go.sum
            echo
            echo "===GO_MOD_SUM_END"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # The plugin SDK is its own module (imported by plugin repositories such
      # as Doldas/floweysales-plugins); ./... at the root does not reach it.
      - name: Plugin SDK (tidy, vet, race tests)
        working-directory: pluginsdk
        run: |
          go mod tidy
          git diff --exit-code -- go.mod || { echo "::error::Run go mod tidy in pluginsdk."; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
      - name: Restore pinned MySQL JDBC dependency cache for Go storage tests
        uses: actions/cache@v4
        with:
          path: docker/vendor/mysql-connector-j-9.5.0.jar
          key: jdbc-linux-9.5.0-${{ hashFiles('docker/mysql-connector-j-9.5.0.sha256') }}
      - name: Verify or fetch pinned MySQL JDBC dependency for Go storage tests
        run: bash scripts/fetch-liquibase-jdbc.sh
      - name: Start disposable Liquibase-backed MySQL for storage tests
        env:
          MYSQL_PASSWORD: ci-only-identity-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        run: |
          docker compose -f compose.identity.yml up -d mysql
          docker compose -f compose.identity.yml --profile migration run --build --rm migrate update
      - name: Unit tests (race detector)
        env:
          STORAGE_TEST_MYSQL_DSN: 'flowey_auth:ci-only-identity-password@tcp(127.0.0.1:3306)/floweysales_auth?parseTime=true&loc=UTC&tls=false'
        run: go test -race -count=1 ./...
      - name: Stop disposable storage MySQL
        if: always()
        env:
          MYSQL_PASSWORD: ci-only-identity-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        run: docker compose -f compose.identity.yml down -v
      - name: Build backend and MCP
        run: |
          mkdir -p dist
          go build -trimpath -o dist/floweysales_backend .
          go build -trimpath -o dist/floweysales_mcp ./cmd/mcp
          # The backend speaks the protocol; it never links plugin code or the SDK.
          if go list -deps . | grep -E 'pluginsdk|floweysales-plugins'; then
            echo "::error::The backend imports plugin code; providers are plugins (see docs/plugins.md)."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: go-linux-amd64
          path: dist/
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen dependencies
        run: npm ci --prefix frontend
      - name: Validate live E2E suite discovery without contacting the deployed instance
        working-directory: frontend
        run: npx playwright test --config playwright.live.config.ts --list
      - name: Dates are UTC and numbers en-US (no browser-dependent formatting)
        run: bash scripts/check-utc-formatting.sh
      - name: Unit tests for Flow Studio helpers
        run: node --test frontend/src/app/components/flow-history.spec.ts frontend/src/app/components/flow-overview.spec.ts frontend/src/app/components/flow-versions.spec.ts frontend/src/app/components/update-status.spec.ts frontend/src/app/components/function-pins.spec.ts frontend/src/app/components/wire-drag.spec.ts frontend/src/app/components/flow-semantics.spec.ts frontend/src/app/components/side-effects.spec.ts frontend/src/app/components/agent-tools.spec.ts frontend/src/app/components/event-adapters.spec.ts frontend/src/app/ui/format.spec.ts frontend/src/app/markdown.spec.ts frontend/src/app/components/plugin-store.spec.ts frontend/src/app/components/investor-nodes.spec.ts frontend/src/app/components/leaderboard-view.spec.ts frontend/src/app/components/backtest-view.spec.ts frontend/src/app/components/plan-view.spec.ts frontend/src/app/components/portfolio-risk.spec.ts frontend/src/app/components/position-size.spec.ts frontend/src/app/components/events-view.spec.ts frontend/src/app/components/today-view.spec.ts frontend/src/app/components/world-view.spec.ts frontend/src/app/core/agent-notices.spec.ts frontend/src/app/core/feed-status.spec.ts frontend/src/app/ui/async-state.spec.ts frontend/src/app/ui/run-progress.spec.ts frontend/src/app/core/instrument-ref.spec.ts frontend/src/app/core/recent-instruments.spec.ts frontend/src/app/help/help-topics.spec.ts frontend/src/app/ui/datetime.spec.ts frontend/src/app/core/provenance.spec.ts frontend/src/app/core/strategy-period.spec.ts frontend/src/app/core/strategy-montecarlo.spec.ts frontend/src/app/core/answer-sources.spec.ts frontend/src/app/components/tool-call-view.spec.ts frontend/src/app/components/team-view.spec.ts frontend/src/app/components/profile-view.spec.ts frontend/src/app/components/team-budget.spec.ts frontend/src/app/core/task-view.spec.ts frontend/src/app/components/draft-test.spec.ts frontend/src/app/markdown-rich.spec.ts frontend/src/app/core/workspace-readme.spec.ts frontend/src/app/ui/flow-canvas/flow-canvas-geometry.spec.ts frontend/src/app/ui/flow-canvas/diagram-adapters.spec.ts
      - name: Production Angular build
        run: npm run build --prefix frontend
      - name: Install headless Chromium for responsive layout tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright Flow Studio journeys (desktop and phone)
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts e2e/flow-journeys.spec.ts
      - name: Playwright Workspace Markdown and README overview (desktop and phone)
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts e2e/workspace-markdown.spec.ts
      - name: Playwright visual evidence (desktop and phone)
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts e2e/visual-evidence.spec.ts
      - name: Playwright Help/About branding and theme checks (desktop and phone)
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts e2e/help-about-branding.spec.ts
      - name: Upload Playwright HTML report, screenshots, video and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 2
      - name: Test Samsung S24, phones, tablets and desktop in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory www/browser >/tmp/floweysales-frontend-server.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke:responsive --prefix frontend
      - name: App and Flow Studio accessibility (axe-core, WCAG 2.1 AA) and editing paths
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory www/browser >/tmp/floweysales-a11y-server.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke:a11y --prefix frontend
          npm run smoke:flow-editor --prefix frontend
      - name: Upload Playwright journey failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flow-journeys-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-preview
          path: www/browser/
          if-no-files-found: error
          retention-days: 14

  identity-schema:
    name: identity-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore pinned MySQL JDBC dependency cache
        uses: actions/cache@v4
        with:
          path: docker/vendor/mysql-connector-j-9.5.0.jar
          key: jdbc-linux-9.5.0-${{ hashFiles('docker/mysql-connector-j-9.5.0.sha256') }}
      - name: Verify or fetch pinned MySQL JDBC dependency
        run: bash scripts/fetch-liquibase-jdbc.sh
      - name: Validate and apply MySQL identity schema
        env:
          MYSQL_PASSWORD: ci-only-identity-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        run: |
          docker compose -f compose.identity.yml up -d mysql
          # Connector/J has already been SHA256-verified and cached above, so the
          # build no longer contacts Maven Central. One retry remains for
          # transient base-image pulls; schema updates are never retried.
          for attempt in 1 2; do
            if docker compose -f compose.identity.yml --profile migration build migrate; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Migration image build failed after 2 attempts (the JDBC jar is cached; check the base image pull)."
              exit 1
            fi
            echo "::warning::Migration image build attempt $attempt failed. Retrying after a backoff."
            sleep 15
          done
          docker compose -f compose.identity.yml --profile migration run --rm migrate validate
          docker compose -f compose.identity.yml --profile migration run --rm migrate update
          docker compose -f compose.identity.yml --profile migration run --rm migrate status --verbose
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test login, session and API authorization on MySQL
        env:
          AUTH_TEST_MYSQL_DSN: 'flowey_auth:ci-only-identity-password@tcp(127.0.0.1:3306)/floweysales_auth?parseTime=true&loc=UTC&tls=false'
        run: go test ./internal/server -run TestMySQLAuthGate -count=1
      - name: Test non-destructive SQLite to MySQL import
        env:
          MIGRATION_TEST_MYSQL_DSN: 'flowey_auth:ci-only-identity-password@tcp(127.0.0.1:3306)/floweysales_auth?parseTime=true&loc=UTC&tls=false'
        run: go test ./cmd/migrate-sqlite -run TestSQLiteImportTransactionalAndNonDestructive -count=1
      - name: Remove disposable CI database
        if: always()
        env:
          MYSQL_PASSWORD: ci-only-identity-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        run: docker compose -f compose.identity.yml down -v

  container-image:
    name: container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model (no committed secrets)
        env:
          MYSQL_PASSWORD: ci-only-mysql-pass
          MYSQL_ROOT_PASSWORD: ci-only-root-pass
          AUTH_BOOTSTRAP_EMAIL: admin@example.test
          AUTH_BOOTSTRAP_PASSWORD: ci-only-long-bootstrap-password
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.deploy.yml config --quiet
          bash -n scripts/auto-update.sh scripts/install-auto-update.sh scripts/fetch-liquibase-jdbc.sh
      - name: Test host updater (backup, migrate, restart, rollback) with a stub engine
        run: bash scripts/test-auto-update.sh
      - name: Build production application image
        run: docker build -t floweysales:ci .
      - name: Restore pinned MySQL JDBC dependency cache
        uses: actions/cache@v4
        with:
          path: docker/vendor/mysql-connector-j-9.5.0.jar
          key: jdbc-linux-9.5.0-${{ hashFiles('docker/mysql-connector-j-9.5.0.sha256') }}
      - name: Verify or fetch pinned MySQL JDBC dependency
        run: bash scripts/fetch-liquibase-jdbc.sh
      - name: Build packaged Liquibase migration image
        run: docker build -f docker/liquibase.Dockerfile -t floweysales-migrate:ci .
      - name: Verify JDBC checksum inside built migration container
        run: |
          expected="$(cut -d' ' -f1 docker/mysql-connector-j-9.5.0.sha256)"
          actual="$(docker run --rm --entrypoint sha256sum floweysales-migrate:ci /liquibase/internal/lib/mysql-connector-j-9.5.0.jar | cut -d' ' -f1)"
          test "$actual" = "$expected"
      - name: Build opt-in read-only legacy importer
        run: docker build --target legacy-importer -t floweysales-legacy-import:ci .
