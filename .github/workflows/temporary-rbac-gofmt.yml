name: Temporary RBAC Go Format
on:
  push:
    branches: [feature/89-user-invitations-rbac]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gofmt -w internal/identity/user_management.go internal/identity/roles.go internal/identity/identity.go internal/identity/smtp_settings.go internal/server/user_management.go internal/server/auth.go internal/server/flows.go internal/server/server.go internal/server/user_management_test.go internal/storage/agent_flows.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/identity internal/server/auth.go internal/server/flows.go internal/server/server.go internal/server/user_management.go internal/server/user_management_test.go internal/storage/agent_flows.go
            git commit -m "style(go): format user management and RBAC"
            git push
          fi
