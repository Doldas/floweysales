name: Temporary Flow Engine v2 format
on:
  push:
    branches: [feature/59-flow-engine-v2-foundations]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format v2 Go sources
        run: |
          gofmt -w internal/server/flows.go internal/server/flow_engine_v2.go internal/server/flow_engine_v2_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_engine_v2.go internal/server/flow_engine_v2_test.go
            git commit -m "style(go): format flow engine v2"
            git push
          fi
