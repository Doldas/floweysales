name: Temporary Retry Gofmt
on:
  push:
    branches: [feature/76-agent-retry-timeout]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Go sources
        run: |
          gofmt -w internal/server/flows.go internal/server/flow_retry_timeout_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/server/flows.go internal/server/flow_retry_timeout_test.go
            git commit -m "style(go): format retry timeout implementation"
            git push
          fi
